services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_user
      POSTGRES_PASSWORD: salary_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_user -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/salary_management
      DATABASE_USERNAME: salary_user
      DATABASE_PASSWORD: salary_password
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      SPRING_PROFILES_ACTIVE: seed
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
