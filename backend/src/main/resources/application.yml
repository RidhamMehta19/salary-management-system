spring:
  application:
    name: salary-management-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salary_management}
    username: ${DATABASE_USERNAME:salary_user}
    password: ${DATABASE_PASSWORD:salary_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME:30000}
      max-lifetime: ${DB_MAX_LIFETIME:240000}
      data-source-properties:
        reWriteBatchedInserts: ${DB_REWRITE_BATCHED_INSERTS:true}
        tcpKeepAlive: ${DB_TCP_KEEP_ALIVE:true}
        socketTimeout: ${DB_SOCKET_TIMEOUT:120}
        connectTimeout: ${DB_CONNECT_TIMEOUT:30}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true
      hibernate.order_updates: true
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.incubyte.salarymanagement: INFO
